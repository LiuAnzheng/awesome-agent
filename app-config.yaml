awesome-agent:
  llm:
    model_id: "deepseek-v4-pro"
    provider: "deepseek"
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
  rag:
    max_doc_size: 52428800
    collection: "rag"
  memory:
    compress:
      max_items_per_session: 100
      min_items_to_trigger: 1
    structure:
      driver: "sqlite"
      options:
        db_path: "./data/memory.db"
    embedding:
      driver: "openai"
      options:
        model_id: "text-embedding-v4"
        api_key: ${EMBEDDING_API_KEY}
        base_url: ${EMBEDDING_BASE_URL}
        dimension: 1024
        batch_size: 10
    vector_store:
      driver: "qdrant"
      options:
        host: "192.168.187.100"
        port: 6333
        api_key: ""
    graph:
      driver: "neo4j"
      options:
        url: "http://192.168.187.100:7474"
        db: "neo4j"
        username: "neo4j"
        password: ${NEO4J_PASSWORD}
