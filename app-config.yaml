awesome-agent:
  llm:
    model_id: "deepseek-v4-pro"
    provider: "deepseek"
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
  memory:
    structure:
      db_path: "./data/memory.db"
    embedding:
      model_id: "text-embedding-v4"
      api_key: ${EMBEDDING_API_KEY}
      base_url: ${EMBEDDING_BASE_URL}
      dimension: 1024
      batch_size: 32
    vector_store:
      host: "127.0.0.1"
      port: 6333
      api_key: ""
      collection: "episodes"
