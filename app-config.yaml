awesome-agent:
  llm:
    model_id: "deepseek-v4-pro"
    provider: "deepseek"
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
  memory:
    structure:
      driver: "sqlite"
      options:
        db_path: "./data/memory.db"
    embedding:
      driver: "openai"
      options:
        model_id: "text-embedding-v4"
        api_key: ${EMBEDDING_API_KEY}
        base_url: ${EMBEDDING_BASE_URL}
        dimension: 1024
        batch_size: 32
    vector_store:
      driver: "qdrant"
      options:
        host: "192.168.187.100"
        port: 6333
        api_key: ""
    graph:
      driver: "neo4j"
      options:
        url: "http://192.168.187.100:7474"
        db: "neo4j"
        username: "neo4j"
        password: ${NEO4J_PASSWORD}
