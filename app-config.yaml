awesome-agent:
  llm:
    model_id: "qwen3.5-omni-plus-2026-03-15"
    provider: "dashscope"
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
    max_tokens: 102400
    temperature: 0.7
    top_p: 1.0
  rag:
    max_doc_size: 52428800
    collection: "rag"
  context:
    max_tokens: 102400
    reserve_ratio: 0.2
    min_relevance: 0.1
    enable_compression: true
    recency_weight: 0.3
    relevance_weight: 0.7
  memory:
    structure:
      driver: "sqlite"
      options:
        db_path: "./data/memory.db"
    embedding:
      driver: "openai"
      options:
        model_id: "text-embedding-v4"
        api_key: ${EMBEDDING_API_KEY}
        base_url: ${EMBEDDING_BASE_URL}
        dimension: 1024
        batch_size: 10
    vector_store:
      driver: "qdrant"
      options:
        host: "192.168.187.100"
        port: 6333
        api_key: ""
    graph:
      driver: "neo4j"
      options:
        url: "http://192.168.187.100:7474"
        db: "neo4j"
        username: "neo4j"
        password: ${NEO4J_PASSWORD}
